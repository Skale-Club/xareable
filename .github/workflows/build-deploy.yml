name: Build and Deploy

# CI→GHCR→Coolify pipeline.
#
# A `verify` gate (type-check + secret scan) runs on every push and PR. The
# image build + Coolify deploy run ONLY on `main`, so a push to a feature
# branch (e.g. `dev`) can never rebuild `:latest` or redeploy production — it
# still gets type-checked, just not shipped.
#
# ── Change these when copying to another repo ───────────────────────────────
#   IMAGE_NAME   ghcr.io/skale-club/<app-name>
#   APP_UUID     Coolify resource UUID (Settings → UUID in the app UI)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skale-club/xareable
  APP_UUID: emitz765i1dvk4a89ofshjhz
  COOLIFY_BASE: https://coolify.skale.club

jobs:
  verify:
    name: Verify (type-check + secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate: a type error fails the pipeline before anything is built.
      - name: Type-check
        run: npm run check

      # Secret scan via the gitleaks CLI (no license required, unlike the
      # marketplace action on org repos). Non-blocking: husky's pre-commit
      # `scan:secrets:staged` is the hard local gate; this is CI visibility.
      - name: Secret scan (gitleaks)
        continue-on-error: true
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --config .gitleaks.toml --redact --source .

  build-and-deploy:
    name: Build image & deploy (main only)
    needs: verify
    # Only main ships. PRs and pushes to dev stop after `verify`.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No NEXT_PUBLIC_*/VITE_* build-args: Xareable reads all config
          # at runtime via /api/config — nothing is inlined at build time.

      - name: Trigger Coolify deploy (pull prebuilt image)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::warning::COOLIFY_TOKEN not set — skipping Coolify trigger."
            echo "Image built and pushed to GHCR. Set COOLIFY_TOKEN secret to auto-deploy."
            exit 0
          fi
          echo "Triggering Coolify pull for app ${APP_UUID}…"
          curl --fail-with-body -sS --retry 3 --retry-all-errors \
            "${COOLIFY_BASE}/api/v1/deploy?uuid=${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo
          echo "Deploy queued. Coolify will pull ghcr.io/…:latest and restart."
